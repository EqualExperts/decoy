[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[project]
name = "decoy"
version = "0.2.0"
authors = [
  { name = "Ian George", email = "ian@quiet.sh" },
  { name = "Adam Fletcher", email = "adam.fletcher@equalexperts.com" },
  { name = "Joe Ainsworth", email = "xenofect@protonmail.com" },
]
description = "Synthetic data functions and tooling for duckdb"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["duckdb", "synthetic", "data"]
license = { text = "MIT" }
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "duckdb",
  "click",
  "faker",
  "mimesis",
  "pandas",
  "pyarrow",
  "pygments",
  "pydantic>=2",
  "pydantic-settings>=2",
  "ipykernel",
  "jupyterlab",
]

[project.optional-dependencies]
dev = ["black", "pytest"]

[project.scripts]
decoy = "decoy.cli:rootcmd"

[tool.setuptools]
packages = ["decoy"]
